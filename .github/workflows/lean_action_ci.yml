name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      # Not a default target (see lakefile.toml), so build it explicitly to keep it
      # from rotting. Compiled only — the benchmark itself is far too slow for CI.
      - name: Build benchmark executable
        run: lake build toeplitzBench
      - name: Build and Deploy API-DOCS
        if: github.ref == 'refs/heads/main'
        # Pinned to a `main` SHA, not `@v1`: the `v1` branch is frozen at a commit
        # predating the `references` input (added 2025-11), so it silently ignored it
        # and doc-gen4 logged "reference page disabled". The repo publishes no tags.
        uses: leanprover-community/docgen-action@10db47458f91456d87804787d3dfcd914b9a19e3 # main @ 2026-06-07
        with:
          # Bibliography for the references page; docstrings cite it as [bibkey]
          # (doc-gen4 injects a link definition for every key it finds bracketed).
          # The action copies this to `docbuild/docs/references.bib`, the only path
          # doc-gen4's `bibPrepass` looks at.
          references: doc/references.bib
