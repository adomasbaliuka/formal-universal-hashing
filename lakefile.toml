name = "universal-hashing"
version = "0.1.0"
keywords = ["math", "universal", "hashing", "hash"]
defaultTargets = ["UniversalHashing", "Tests", "Examples"]
testDriver = "Tests"

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
autoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

# PrimeCert certifies the NTT modulus prime (`prime_3221225473`). Pinned to a master commit:
# it must agree with the Mathlib version below (that commit pins Mathlib `v4.33.0`).
# Required *before* Mathlib so that Mathlib's transitive dependency versions take precedence.
[[require]]
name = "PrimeCert"
git = "https://github.com/b-mehta/PrimeCert.git"
rev = "0803c2f6bd289c09704c7d352bb8fcf770cbb9b2"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.0"

[[lean_lib]]
name = "UniversalHashing"

[[lean_lib]]
name = "Tests"

# NOTE: do *not* add this to `defaultTargets`. The docs CI job asks Lake for the
# `:docs` facet of every default target, and that facet exists only for `lean_lib` —
# a `lean_exe` there fails the docs build with "unknown lean_exe facet `docs`".
# CI compiles it via an explicit `lake build toeplitzBench` step instead.
[[lean_exe]]
name = "toeplitzBench"
root = "Tests.ToeplitzBench"

# Compiled in CI so the worked examples cannot silently rot when names change.
[[lean_lib]]
name = "Examples"
srcDir = "examples"
