name = "universal-hashing"
version = "0.1.0"
keywords = ["math", "universal", "hashing", "hash"]
defaultTargets = ["UniversalHashing"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
autoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.30.0"

[[require]]
name = "PrimeCert"
git = "https://github.com/b-mehta/PrimeCert.git"
rev = "v4.30.0"

[[lean_lib]]
name = "UniversalHashing"
