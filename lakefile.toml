name = "universal-hashing"
version = "0.1.0"
keywords = ["math", "universal", "hashing", "hash"]
defaultTargets = ["UniversalHashing", "Tests", "toeplitzBench", "Examples"]
testDriver = "Tests"

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
autoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.0"

[[lean_lib]]
name = "UniversalHashing"

[[lean_lib]]
name = "Tests"

[[lean_exe]]
name = "toeplitzBench"
root = "Tests.ToeplitzBench"

# Compiled in CI so the worked examples cannot silently rot when names change.
[[lean_lib]]
name = "Examples"
srcDir = "examples"
